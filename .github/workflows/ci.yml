name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: brew install cmake
      - name: Unit tests
        run: |
          export LIBCLANG_PATH="$(dirname "$(xcrun --find clang)")/../lib"
          cargo test --lib
